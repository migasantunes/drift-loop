[project]
name = "driftloop"
version = "0.1.0"
description = "A recommender system that notices when it is going stale and retrains itself."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "José Miguel Luís Antunes" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Real-data download (milestone M1). Heavier extras (torch, faiss, mlflow, fastapi)
# are added by the milestone that first needs them - see docs/PLAN.md.
data = ["huggingface_hub>=0.25"]

[project.scripts]
driftloop = "driftloop.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftloop"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Ruff also formats Python blocks inside Markdown; the briefs contain signature
# sketches that are not meant to be valid, formatted code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: end-to-end tests that take more than a few seconds"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
